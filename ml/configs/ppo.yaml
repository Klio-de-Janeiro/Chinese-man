ppo:
  base_checkpoint: artifacts/ml/imitation/best.pt
  output_dir: artifacts/ml/ppo
  seed: 2026
  updates: 100
  episodes_per_update: 256
  player_counts: [2, 3]
  batch_size: 1024
  ppo_epochs: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  gamma: 1.0
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  heuristic_probability: 0.2
  historical_probability: 0.3
  checkpoint_every: 5
  max_historical_models: 4
